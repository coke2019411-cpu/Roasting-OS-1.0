<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>로스팅 로거</title>
<style>
  :root { --bg:#f2f2f7; --card:#ffffff; --text:#1c1c1e; --sub:rgba(60,60,67,0.6); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#000; --card:#1c1c1e; --text:#f2f2f7; --sub:rgba(235,235,245,0.6); } }
  body { margin:0; background:var(--bg); color:var(--text);
         font-family:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  main { max-width:420px; margin:0 auto; padding:64px 16px; text-align:center; }
  .card { background:var(--card); border-radius:14px; padding:24px 18px; }
  h1 { font-size:21px; margin:0 0 8px; }
  p { color:var(--sub); font-size:14px; line-height:1.6; margin:0; }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>로스팅 로거</h1>
    <p>이메일 인증이 끝났다면 이 창을 닫고<br>로스팅 로거 프로그램에서 로그인하세요.</p>
  </div>
</main>
</body>
</html>
